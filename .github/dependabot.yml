# Atualizações automáticas de dependências (PRs semanais) e das actions do CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      # Os tipos do Node acompanham a versão mínima suportada (22), não a mais nova.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
